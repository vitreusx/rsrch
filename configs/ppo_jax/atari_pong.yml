# yaml-language-server: $schema=schema.json
env:
  type: atari
  atari:
    env_id: Pong
    screen_size: 84
    frame_skip: 4
    obs_type: grayscale
    noop_max: 30
    fire_reset: true
    term_on_life_loss: true
    time_limit: 108e3
    stack_num: 4
    use_envpool: false
    repeat_action_probability: 0.25 # *-v5 setting
num_envs: 1
seed: 0
steps_per_batch: 1024
min_seq_len: 8
adamw_lr: 3e-4
adamw_eps: 1e-5
update_epochs: 4
mb_size: 256
adv_norm: true
clip_coef: 0.1
clip_vloss: true
gamma: 0.99
gae_lambda: 0.95
clip_grad: null
vf_coef: 0.5
ent_coef: 0.1
target_critic: null
rew_transform: sign
