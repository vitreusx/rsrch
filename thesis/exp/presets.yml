thesis:
  base:
    $extends: [dreamer.atari, atari.base]
    # For all experiments (save the sanity check) we reserve 15% of the episodes for validation purposes.
    data.val_frac: 0.15

  sanity_check:
    # Check if the reference scores for base DreamerV2 are correct
    $extends: [base]
    data.val_frac: 0.0
    stages:
      - prefill:
          until: 200e3
      - train_loop:
          until: 6e6
          tasks:
            - do_val_epoch: ~
              every: 250e3
            - do_opt_step: ~
              every:
                n: 64
                accumulate: true
            - do_env_step
      - do_val_epoch

  no_sticky:
    # Check what the scores are (at 6m horizon) with Atari-100k env setup (i.e. without sticky actions.)
    $extends: [base, atari.v4]
    data.val_frac: 0.0
    stages:
      - prefill:
          until: 200e3
      - train_loop:
          until: 6e6
          tasks:
            - do_val_epoch: ~
              every: 250e3
            - do_opt_step: ~
              every:
                n: 64
                accumulate: true
            - do_env_step
      - do_val_epoch

  baseline:
    # A baseline test - run the loop for 400k steps, with variable update freq
    $extends: [base]
    _ratio: 64 # Ratio of env steps to model/agent opt steps
    _prefill: 20e3
    stages:
      - prefill:
          until: ${_prefill}
      - train_loop:
          until: 400e3
          tasks:
            - do_val_epoch: ~
              every: 20e3
            - do_val_step: ~
              every: { n: 16, of: wm_opt_step }
            - do_opt_step: ~
              every:
                n: ${_ratio}
                accumulate: true
            - do_env_step
      - do_val_epoch
      - save_ckpt:
          full: false
          tag: final

  split_ratios:
    # Like the baseline test, but the model and agent update freqs are different
    $extends: [base]
    _wm_ratio: 64
    _rl_ratio: 64
    _prefill: 20e3
    stages:
      - prefill:
          until: ${_prefill}
      - train_loop:
          until: 400e3
          tasks:
            - do_val_epoch: ~
              every: 20e3
            - do_wm_val_step: ~
              every: { n: 16, of: wm_opt_step }
            - do_rl_val_step: ~
              every: { n: 16, of: rl_opt_step }
            - do_wm_opt_step: ~
              every:
                n: ${_wm_ratio}
                accumulate: true
            - do_rl_opt_step: ~
              every:
                n: ${_rl_ratio}
                accumulate: true
            - do_env_step
      - do_val_epoch
      - save_ckpt:
          full: false
          tag: final

  pretrain:
    # Perform offline pretraining stage after the prefill stage
    $extends: [base]
    _wm_ratio: 64
    _rl_ratio: 64
    _prefill: 20e3
    _rl_freq: 0.0
    stages:
      - prefill:
          until: ${_prefill}
      - pretrain:
          stop_criteria:
            rel_patience: 0.5
            margin: 0.0
            min_steps: 1024
          val_on_loss_improv: 0.2
          val_every: 1024
          max_val_batches: 128
          rl_opt_freq: ${_rl_freq}
      - train_loop:
          until: 400e3
          tasks:
            - do_val_epoch: ~
              every: 20e3
            - do_wm_val_step: ~
              every: { n: 16, of: wm_opt_step }
            - do_rl_val_step: ~
              every: { n: 16, of: rl_opt_step }
            - do_wm_opt_step: ~
              every:
                n: ${_wm_ratio}
                accumulate: true
            - do_rl_opt_step: ~
              every:
                n: ${_rl_ratio}
                accumulate: true
            - do_env_step
      - do_val_epoch
      - save_ckpt:
          full: false
          tag: final

  adaptive_ratio:
    base:
      # A setup, where an adaptive model/RL module update frequencies is used
      $extends: [thesis.base]
      _prefill: 20e3
      _rl_ratio: 0.0
      _update_period: 2e3
      _adaptive_setup: {}
      stages:
        - prefill:
            until: ${_prefill}
        - adaptive_setup: ${_adaptive_setup}
        - train_loop:
            until: 400e3
            tasks:
              - do_val_epoch: ~
                every: 20e3
              - update_adaptive_opt: ~
                every: ${_update_period}
              - do_adaptive_opt_step
              - do_rl_opt_step: ~
                every:
                  n: ${_rl_ratio}
                  accumulate: true
              - do_env_step
        - do_val_epoch
        - save_ckpt:
            full: false
            tag: final

    v1:
      $extends: [base]
      _rl_ratio: 0.0
      _v1_variant: "0"
      _adaptive_setup:
        rl_to_wm_ratio: 1.0
        type: v1
        v1:
          variant: ${_v1_variant}
          ratio_range: [1, 128]
          update_mult: 1.3
          initial_value: 64

    wm_v1:
      $extends: [v1]
      _rl_ratio: 2.0
      _adaptive_setup.rl_to_wm_ratio: 0.0

    wm_v2:
      $extends: [base]
      _rl_ratio: 4.0
      _adaptive_setup:
        rl_to_wm_ratio: 0.0
        type: v2
        v2:
          ratio_range: [1, 128]
          update_mult: 1.3
          initial_value: 64
          try_unused_after: 100e3

    wm_v3:
      $extends: [base]
      _rl_ratio: 4.0
      _adaptive_setup:
        rl_to_wm_ratio: 0.0
        type: v3
        v3:
          ratio_range: [2, 128]
          update_mult: 1.3

    v4:
      $extends: [base]
      _adaptive_setup:
        rl_to_wm_ratio: 1.0
        type: v4
        v4:
          init_ratio: 16
          init_time: ${_prefill}
          final_ratio: 4
          final_time: 400e3

  warm_start:
    # Like `sanity_check`, except that we load the parameters from another run to check if it impacts the performance. We use the same base env ID, but "randomize" it (swap channels, flip axes, permute actions etc.) to simulate continual setting.
    $extends: [base]
    _ckpt_path: ~
    env:
      type: atari
      atari.randomize: true
    data.val_frac: 0.0
    stages:
      - load_ckpt:
          path: "${_ckpt_path}"
      - prefill:
          until: 200e3
      - train_loop:
          until: 6e6
          tasks:
            - do_val_epoch: ~
              every: 250e3
            - do_opt_step: ~
              every:
                n: 64
                accumulate: true
            - do_env_step
      - do_val_epoch

  data_aug:
    $extends: [adaptive_ratio.wm_v1]
    _rl_ratio: 4.0
    data.loaders.dreamer_wm:
      augment: drq

  warm_start_actor:
    $extends: [base]
    _ckpt_path: ~
    env:
      type: atari
      atari.randomize: true
    data.val_frac: 0.0
    stages:
      - load_ckpt:
          path: "${_ckpt_path}"
          only: [actor]
      - prefill:
          until: 200e3
      - train_loop:
          until: 6e6
          tasks:
            - do_val_epoch: ~
              every: 250e3
            - do_opt_step: ~
              every:
                n: 64
                accumulate: true
            - do_env_step
      - do_val_epoch

  data_aug_2:
    $extends: [baseline]
    data.loaders.dreamer_wm:
      augment: drq
